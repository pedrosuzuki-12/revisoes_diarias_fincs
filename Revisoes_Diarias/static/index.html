<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revisão de Pagamentos - Fincs</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --primary-color: #F49A1C; /* Laranja Fincs */
      --primary-hover: #d88615;
      --secondary-color: #082c5a; /* Azul Fincs */
      --border-radius: 12px;
      --border-color: #e2e8f0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background-color: var(--card-bg);
      padding: 2.5rem;
      border-radius: var(--border-radius);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
      width: 100%;
      max-width: 420px;
      box-sizing: border-box;
      border-top: 6px solid var(--primary-color);
    }

    .logo {
      max-width: 260px;
      margin-bottom: 1.5rem;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 2rem;
      font-weight: 600;
      color: var(--secondary-color);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    input[type="file"] {
      padding: 1rem;
      border: 2px dashed #cbd5e1;
      border-radius: var(--border-radius);
      cursor: pointer;
      font-size: 0.9rem;
      color: #4a5568;
      background-color: #f8fafc;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    input[type="file"]:hover {
      border-color: var(--primary-color);
      background-color: #fffdf8;
    }

    input[type="file"]::file-selector-button {
      background-color: var(--secondary-color);
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      margin-right: 1rem;
      color: white;
      transition: background-color 0.2s;
    }

    input[type="file"]::file-selector-button:hover {
      background-color: #061f40;
    }

    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.05rem;
      font-weight: 700;
      transition: background-color 0.2s ease, transform 0.1s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    /* Animação de Loading */
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Estado de loading no botão */
    button.is-loading {
      pointer-events: none;
      opacity: 0.85;
      background-color: var(--primary-hover);
    }

    /* Link da Planilha Modelo */
    .template-link {
      margin-top: 1.5rem;
      font-size: 0.9rem;
    }

    .template-link a {
      color: var(--secondary-color);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .template-link a:hover {
      color: var(--primary-color);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/static/logo.png" alt="Logo Fincs" class="logo">
    <h2>Revisão de Pagamentos</h2>

    <form id="uploadForm" action="/processar" method="post" enctype="multipart/form-data">
      <input type="file" name="arquivo" accept=".xlsx" required>
      <button type="submit" id="submitBtn">Processar</button>
    </form>

    <div class="template-link">
      <a href="/static/planilha_modelo.xlsx" download="Planilha_Modelo.xlsx">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Baixar Planilha Modelo
      </a>
    </div>
  </div>

  <script>
    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
      e.preventDefault(); // Impede o envio padrão que trava a tela
      
      const form = e.target;
      const btn = document.getElementById('submitBtn');
      const originalText = btn.innerHTML; // Salva o texto "Processar"
      
      // Adiciona o spinner e muda o texto
      btn.innerHTML = '<span class="spinner"></span> Processando...';
      btn.classList.add('is-loading');

      try {
        const formData = new FormData(form);
        const response = await fetch(form.action, {
          method: form.method,
          body: formData
        });

        if (!response.ok) {
          throw new Error('Erro ao processar o arquivo. Verifique se é um .xlsx válido.');
        }

        // Gera o nome do arquivo de retorno com base no arquivo original enviado
        const fileInput = document.querySelector('input[type="file"]');
        let filename = 'Retorno.xlsx';
        if (fileInput.files.length > 0) {
          const originalName = fileInput.files[0].name;
          // Pega "planilha.xlsx" e transforma em "planilha_Retorno.xlsx"
          filename = originalName.replace(/\.xlsx$/i, '') + '_Retorno.xlsx';
        }

        // Baixa o arquivo retornado
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        
        // Limpeza
        window.URL.revokeObjectURL(url);
        a.remove();
        
        // Opcional: limpa o input de arquivo
        form.reset();
        
      } catch (error) {
        alert(error.message);
      } finally {
        // Restaura o botão ao estado normal!
        btn.innerHTML = originalText;
        btn.classList.remove('is-loading');
      }
    });
  </script>
</body>
</html>
